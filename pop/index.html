<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동차부품 제조업 POP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* 디자인 토큰: ARCON · AI 오케스트레이션과 같은 결 (다크 기본, 사이드바는 두 테마 모두 어둡게) */
:root{
  --bg:#060A13; --bg-grad:radial-gradient(1200px 600px at 85% -10%, rgba(56,189,248,.08), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(129,140,248,.07), transparent 60%);
  --surface:#0C1322; --surface2:#111A2C; --surface3:#16213A; --ink:#E6EDF7; --ink2:#C3CEE0; --muted:#8293AE; --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --accent:#38BDF8; --accent2:#22D3EE; --accent-ink:#04121C; --accent-soft:rgba(56,189,248,.12);
  --rail:#070C17; --rail-line:rgba(148,163,184,.10); --rail-ink:#C8D3E6; --rail-muted:#6E7F9C; --rail-active:linear-gradient(90deg, rgba(56,189,248,.22), rgba(56,189,248,.06));
  --ok:#34D399; --warn:#FBBF24; --crit:#FB7185; --info:#818CF8;
  --ok-soft:rgba(52,211,153,.12); --warn-soft:rgba(251,191,36,.12); --crit-soft:rgba(251,113,133,.12); --info-soft:rgba(129,140,248,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  --f-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F7FB; --bg-grad:radial-gradient(1100px 500px at 90% -20%, rgba(37,99,235,.06), transparent 60%);
  --surface:#FFFFFF; --surface2:#F8FAFC; --surface3:#F1F5F9; --ink:#0F172A; --ink2:#334155; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
  --accent:#2563EB; --accent2:#0891B2; --accent-ink:#FFFFFF; --accent-soft:#EFF6FF;
  --ok:#059669; --warn:#B45309; --crit:#E11D48; --info:#4F46E5;
  --ok-soft:#ECFDF5; --warn-soft:#FFFBEB; --crit-soft:#FFF1F2; --info-soft:#EEF2FF;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 16px -8px rgba(15,23,42,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) fixed;background-image:var(--bg-grad);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
:root[lang="ja"] body,:root[lang="ko"] body{line-break:strict}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 틀 */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--rail-line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;color:var(--rail-ink);scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 4px}
.brand .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0EA5E9,#6366F1);box-shadow:0 6px 18px -6px rgba(56,189,248,.55)}
.brand .bt{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:15.5px;letter-spacing:-.02em;color:#F1F5F9}
.brand .bt span{font-size:11.5px;color:var(--rail-muted)}
.tenant{display:grid;gap:3px;padding:10px 12px;border-radius:12px;background:rgba(148,163,184,.06);border:1px solid var(--rail-line);font-size:12px}
.tenant .tl1{display:flex;justify-content:space-between;color:var(--rail-muted);font-size:11px}
.tenant .okc{display:inline-flex;align-items:center;gap:5px;color:#34D399}
.tenant .okc::before{content:"";width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 8px #34D399}
.tenant .tl2{color:#E2E8F0;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--rail-muted);padding:10px 10px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--rail-ink);text-decoration:none;position:relative;transition:background .15s,color .15s;cursor:pointer}
.nav a:hover{background:rgba(148,163,184,.08);color:#fff}
.nav a svg{color:var(--rail-muted)}
.nav a .nl{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.nav a .nl span{font-size:13.5px;font-weight:600}
.nav a .nl small{font-size:11px;color:var(--rail-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a[aria-current="page"]{background:var(--rail-active);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#38BDF8;box-shadow:0 0 12px #38BDF8}
.nav a[aria-current="page"] svg{color:#38BDF8}
.nav a[aria-current="page"] .nl small{color:#93C5FD}
.badge-n{margin-left:auto;font-size:11px;background:#F43F5E;color:#fff;border-radius:999px;padding:0 7px;font-weight:700;line-height:18px;box-shadow:0 0 10px rgba(244,63,94,.5)}
.scope{margin-top:auto;border:1px solid var(--rail-line);border-radius:12px;padding:12px;font-size:12px;display:grid;gap:7px;background:rgba(148,163,184,.05)}
.scope .who{display:flex;align-items:center;gap:10px}
.scope .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#04121C;background:linear-gradient(135deg,#7DD3FC,#A5B4FC);flex:none}
.scope .wn{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.scope .wn b{color:#F1F5F9;font-size:13px}
.scope .wn small{color:var(--rail-muted);font-size:11px}
.scope label{color:var(--rail-muted);font-size:11px;margin-top:2px}
.scope select{width:100%;padding:7px 9px;font-size:12px;background:#0B1324;border:1px solid var(--rail-line);color:#E2E8F0;border-radius:8px}

.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:16px;padding:12px 28px;background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:600}
.tsearch{position:relative;flex:1;max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:10px;padding:0 16px;height:42px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tsearch svg{color:var(--accent)}
.tsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13.5px}
.tsearch input::placeholder{color:var(--muted)}
.sres{position:absolute;left:0;right:0;top:48px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);padding:6px;display:none;max-height:360px;overflow:auto;z-index:30}
.sres.on{display:block}
.sres button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.sres button:hover{background:var(--surface2)}
.sres small{color:var(--muted)}
.tacts{display:flex;align-items:center;gap:8px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#F43F5E;box-shadow:0 0 8px #F43F5E}
.langsw{display:inline-flex;align-items:center;gap:2px;height:38px;padding:0 4px 0 9px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink2)}
.langsw>svg{width:15px;height:15px;margin-right:4px;color:var(--muted)}
.langsw button{min-width:30px;height:28px;padding:0 6px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-weight:600;font-size:12px;cursor:pointer}
.langsw button:hover{color:var(--ink)}
.langsw button.on{background:var(--accent);color:var(--accent-ink)}

main{padding:24px 28px 56px;min-width:0;width:100%;max-width:1720px;margin-inline:auto}
h1{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.3}
h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.015em}
.lede{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:15px;color:var(--ink2);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel>header .hs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)} .small{font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .kl{font-size:12px;color:var(--muted)}
.kpi .kv{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .kd{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--bc,var(--ok));transition:width .4s}
.state{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 14px;border:1px solid var(--sc);background:var(--ss)}
.state .dot{width:12px;height:12px;border-radius:50%;background:var(--sc);box-shadow:0 0 12px var(--sc);flex:none}
.state b{font-size:19px;color:var(--sc)}
.s-none{--sc:var(--accent);--ss:var(--accent-soft)} .s-run{--sc:var(--ok);--ss:var(--ok-soft)} .s-wait{--sc:var(--muted);--ss:var(--surface2)}
.s-stop{--sc:var(--warn);--ss:var(--warn-soft)} .s-brk{--sc:var(--crit);--ss:var(--crit-soft)} .s-done{--sc:var(--info);--ss:var(--info-soft)}

/* 표 */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);max-height:420px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
tbody tr.sel{background:var(--accent-soft)}
td.r,th.r{text-align:right}
td.empty{color:var(--muted);text-align:center;padding:18px}
td input,td select{width:100%;min-width:70px;padding:4px 7px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 배지 */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)}
.p-info{background:var(--info-soft);color:var(--info)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-line{border-color:var(--line2);color:var(--muted)}

/* 컨트롤 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 10px;min-width:0;color:var(--ink)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.lg{padding:10px 18px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* POP 레이아웃 */
.pop{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 230px;gap:14px;align-items:start}
.acts-col{display:flex;flex-direction:column;gap:8px}
.abtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink);box-shadow:var(--shadow)}
.abtn:hover{border-color:var(--accent)}
.abtn svg{color:var(--muted)}
.abtn.go{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)} .abtn.go svg{color:var(--accent)}
.abtn.end{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .abtn.end svg{color:var(--accent-ink)}
.abtn.crit{color:var(--crit)} .abtn.crit svg{color:var(--crit)}
.docs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.doc{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;font-weight:700;color:var(--ink)}
.doc:hover{border-color:var(--accent)}
.doc small{font-weight:500;color:var(--muted);font-size:11.5px}
.doc small.req{color:var(--crit)}
.doc:disabled{opacity:.45;cursor:not-allowed}
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px;font-weight:700;font-size:13.5px}
.sub-h:first-child{margin-top:0}
.sub-h small{color:var(--muted);font-weight:500}
.numin{width:100%;padding:9px 12px;font-size:20px;font-weight:700;text-align:right;border:1px solid var(--accent);background:var(--surface2);border-radius:10px;font-family:var(--f-mono);color:var(--ink)}
.numin:disabled{border-color:var(--line);opacity:.7}
.kis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ki{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px;cursor:pointer;font-family:var(--f-mono);font-weight:600;text-align:center;color:var(--ink)}
.ki.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ki.done{color:var(--ok)}
.ki small{display:block;font-family:var(--f-sans);font-size:11px;color:var(--muted);font-weight:500}
.emptybox{border:1px dashed var(--line2);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.emptybox b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}

/* 모달 */
.dim{position:fixed;inset:0;background:rgba(2,6,15,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.dim.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:16px;width:min(1100px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:17px}
.modal header small{color:var(--muted);margin-left:8px;font-size:12.5px;font-weight:500}
.modal .mb{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:0}
.note.warn{border-color:var(--warn)}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.formgrid .input{width:100%}
.label{border:1px solid var(--line2);border-radius:12px;padding:14px;background:#fff;color:#111;width:420px;max-width:100%;font-size:12.5px}
.label table{font-size:12.5px} .label th,.label td{color:#111;background:#fff;border:1px solid #333;padding:4px 7px;position:static;white-space:normal}
.label th{background:#f1f1f1;width:96px}
.bars{height:54px;margin-top:10px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 7px,#fff 7px 8px,#111 8px 9px,#fff 9px 12px)}
.qr{width:164px;height:164px;display:grid;grid-template-columns:repeat(21,1fr);background:#fff;padding:8px;border-radius:8px;flex:none}
.qr i{background:#111}.qr i.w{background:#fff}
.pdf{background:var(--surface3);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:18px;min-height:460px}
.pg{width:340px;max-width:100%;height:440px;background:#fff;color:#333;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:26px;font-size:12px;border-radius:3px}
.pg h4{margin:0 0 6px;text-align:center;font-size:18px}
.pg .ln{height:9px;background:#e5e7eb;margin:8px 0;border-radius:3px}
.pg .bx{height:140px;border:1px dashed #9aa5b1;margin:12px 0;display:flex;align-items:center;justify-content:center;color:#8795a1;text-align:center}
.docgrid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:14px}

/* 토스트 */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center;animation:tin 3s forwards}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc,#38BDF8);flex:none}
.toast.success{--tc:#34D399} .toast.warning{--tc:#FBBF24} .toast.error{--tc:#FB7185}
@keyframes tin{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* 모바일 */
.mobwrap{display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}
.phone{width:380px;height:760px;background:#05080F;border-radius:46px;padding:12px;border:1px solid var(--line2);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.screen{background:var(--bg);background-image:var(--bg-grad);width:100%;height:100%;border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
.mbar{background:var(--rail);color:#fff;padding:40px 18px 14px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
.mbody{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.mbody td{white-space:normal}
.photo{flex:1;min-height:180px;border:2px dashed var(--line2);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:12px;background:var(--surface2)}
.photo.has{border-style:solid;border-color:var(--accent);background:linear-gradient(135deg,#334155,#0f172a);color:#fff}
.mbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbtns .btn{justify-content:center}
.steps{margin:0;padding-left:20px;line-height:1.9}
.alarm{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0}
.alarm .sev{align-self:stretch;border-radius:0 3px 3px 0}

@media (max-width:1320px){.pop{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pop .acts-col{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.abtn{width:auto;flex:1 1 150px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.docgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--line);z-index:20;overflow:visible}
  .brand .bt,.scope,.nav .sec,.tenant{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:6px 9px}.nav a .nl small,.nav a svg{display:none}
  .nav a[aria-current="page"]::before{display:none}
  .topbar{padding:10px 16px;flex-wrap:wrap;top:57px}.crumb{display:none}
  .tsearch{order:3;flex-basis:100%;max-width:none}
  main{padding-inline:16px}
  .pop,.g2,.g4,.mobwrap{grid-template-columns:minmax(0,1fr)}
  .docs{grid-template-columns:repeat(2,minmax(0,1fr))}
  dl.kv{grid-template-columns:auto minmax(0,1fr)}
  .formgrid{grid-template-columns:minmax(0,1fr)}
  .phone{width:100%;max-width:380px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function table(id,cols,rows,{sel,empty='조회된 데이터가 없습니다.',click=true,align}={}){
